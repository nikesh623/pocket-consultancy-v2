services:
  - type: web
    name: pocket-consultancy-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: pocket_consultancy_v2
      - key: MONGODB_MIN_POOL_SIZE
        value: "0"
      - key: MONGODB_MAX_POOL_SIZE
        value: "20"
      - key: MONGODB_SERVER_SELECTION_TIMEOUT_MS
        value: "10000"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULL_NAME
        value: System Administrator
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000
      - key: UPLOAD_DIR
        value: /app/storage/uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "5"
